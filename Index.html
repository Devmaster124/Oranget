(function () {
  // The old full-page "Script error" cover could appear while the game was still starting and then stay on top of it.
  // Now: opaque errors from CDN scripts are ignored, and a message only shows inside the start-up screen if the game truly fails to start.
  var boot = function () { return document.querySelector('.boot') }
  var show = function (html) { var b = boot(); if (b) b.innerHTML = '<div>' + html + '<p><button onclick="location.reload()">Reload</button></p></div>' }
  addEventListener('error', function (e) {
    if (!e.filename && (!e.message || e.message === 'Script error.')) return
    console.error(e.message || e)
    show('<p>Oranget hit an error while starting:</p><pre style="white-space:pre-wrap;font-size:14px">' + String(e.message || e).replace(/</g, '&lt;') + '</pre>')
  })
  setTimeout(function () { show('<p>Oranget is taking a while to start. Check your connection, then reload.</p>') }, 15000)
})()
</script>

const isFuse = (id) => typeof id === 'string' && id.startsWith('fuse:')
const isLab = (id) => isFuse(id) || id === 'slime'
const fuseCache = {}
const baseOf = (k) => (k === 'slime' ? SLIME : BLOOKS.find((b) => b.id === k))
const byId = (id) => {
  if (isFuse(id)) {
    if (fuseCache[id]) return fuseCache[id]
    const m = /^fuse:([a-z]+)\+([a-z]+):([0-6])$/.exec(id)
    const a = m && baseOf(m[1]), b = m && baseOf(m[2])
    if (!a || !b) return undefined
    const n1 = a.name.replace(/\s/g, ''), n2 = b.name.replace(/\s/g, '')
    return (fuseCache[id] = { id, name: n1.slice(0, Math.ceil(n1.length / 2)) + n2.slice(-Math.ceil(n2.length / 2)).toLowerCase(), rarity: RK[+m[3]], pack: 'lab', parts: [a.id, b.id] })
  }
  return id === 'slime' ? SLIME : BLOOKS.find((b) => b.id === id)
}
function rollBlook(packId) {

const TRADE_URL = BACKEND ? BACKEND + '/r/trades' : 'https://ntfy.sh/oranget-trades-q8m3v7x2'
const NAME_OK = /^[A-Za-z0-9_]{3,16}$/
const sv = (x) => (Number.isFinite(x) ? Math.max(0, Math.min(10000000, Math.floor(x))) : 0)
const xpOf = (u) => (u.packs || 0) * 10 + (u.msgs || 0) * 2 + (u.trades || 0) * 25
const levelOf = (u) => 1 + Math.floor(xpOf(u) / 100)
const scoreOf = (u) => u.inv.reduce((s, id) => s + (PTS[byId(id)?.rarity] || 0), 0)
const snapOf = (u) => ({ av: u.avatar && u.inv.includes(u.avatar) ? u.avatar : u.inv[0] || 'toast', lv: levelOf(u), ub: new Set(u.inv.filter((x) => !isLab(x))).size, pk: u.packs || 0, ms: u.msgs || 0, tr: u.trades || 0, sc: scoreOf(u), tk: u.tokens, g: u.guild ? u.guild.id : '' })

const hub = (() => {
  let log = [], pres = {}, ids = new Set(), subs = new Set(), started = false, status = '', queued = false, state = 'retry'
  const notify = () => { if (queued) return; queued = true; setTimeout(() => { queued = false; subs.forEach((f) => f()) }, 150) }
  const add = (m, nid, at) => {
    if (!m || typeof m.t !== 'string' || typeof m.from !== 'string' || !NAME_OK.test(m.from)) return
    if (m.to !== undefined && !(typeof m.to === 'string' && NAME_OK.test(m.to))) return
    if (m.id !== undefined && !(typeof m.id === 'string' && m.id.length <= 12)) return
    if (m.t === 'pres') {
      const s = m.s && typeof m.s === 'object' ? { av: byId(m.s.av) ? m.s.av : 'toast', lv: sv(m.s.lv), ub: sv(m.s.ub), pk: sv(m.s.pk), ms: sv(m.s.ms), tr: sv(m.s.tr), sc: sv(m.s.sc), tk: sv(m.s.tk), g: typeof m.s.g === 'string' && /^[a-z0-9]{6,12}$/.test(m.s.g) ? m.s.g : '' } : undefined
      if (!pres[m.from] || pres[m.from].at <= at) pres[m.from] = { at, s }
      notify(); return
    }
    log.push({ t: m.t, from: m.from, to: m.to, id: m.id, h: typeof m.h === 'string' ? m.h.slice(0, 80) : undefined, blook: typeof m.blook === 'string' ? m.blook.slice(0, 40) : undefined, mid: typeof m.mid === 'string' ? m.mid.slice(0, 12) : undefined, text: typeof m.text === 'string' ? m.text.replace(/[\u0000-\u001f\u007f]/g, '').replace(/https?:\/\/\S+/gi, '[link removed]').slice(0, 120) : undefined, price: Number.isInteger(m.price) ? m.price : undefined, offer: Array.isArray(m.offer) ? m.offer.filter((x) => typeof x === 'string').slice(0, 4) : undefined, gid: typeof m.gid === 'string' && /^[a-z0-9]{6,12}$/.test(m.gid) ? m.gid : undefined, gname: typeof m.gname === 'string' ? m.gname.replace(/[^A-Za-z0-9 ]/g, '').slice(0, 20) : undefined, tag: typeof m.tag === 'string' ? m.tag.replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 4) : undefined, logo: typeof m.logo === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,3600}$/.test(m.logo) ? m.logo : undefined, dmg: Number.isInteger(m.dmg) ? Math.max(0, Math.min(20000, m.dmg)) : undefined, crit: m.crit === true, bk: Number.isInteger(m.bk) ? Math.max(0, Math.min(999, m.bk)) : undefined, hp: Number.isInteger(m.hp) ? Math.max(-1, Math.min(100000000, m.hp)) : undefined, nid, at, seen: Date.now() })

  }
  const ok = () => { if (state !== 'ok') { state = 'ok'; status = ''; notify() } }
  const bad = () => { if (state !== 'retry') { state = 'retry'; status = 'Reconnecting…'; notify() } }
  const start = () => {
    if (started || !FB || !FB.auth.currentUser) return; started = true
    const ms = (t) => (t && t.toMillis ? t.toMillis() : Date.now())
    FB.db.collection('trades').where('ts', '>', FB.T.fromMillis(Date.now() - 12 * 3600e3)).orderBy('ts').onSnapshot((snap) => {
      snap.docChanges().forEach((c) => { if (c.type !== 'added' || ids.has(c.doc.id)) return; ids.add(c.doc.id); const d = c.doc.data({ serverTimestamps: 'estimate' }); try { add(JSON.parse(d.m), c.doc.id, ms(d.ts)) } catch {} })
      ok(); notify()
    }, bad)
    FB.db.collection('presence').orderBy('at', 'desc').limit(300).onSnapshot((snap) => {
      snap.docChanges().forEach((c) => { if (c.type === 'removed') return; const d = c.doc.data({ serverTimestamps: 'estimate' }); try { add({ t: 'pres', from: d.name, s: JSON.parse(d.s) }, c.doc.id, ms(d.at)) } catch {} })
      notify()
    }, bad)
  }
  const send = async (m) => {
    if (!FB || !FB.auth.currentUser) return
    const uid = FB.auth.currentUser.uid
    try {
      if (m.t === 'pres') await FB.db.doc('presence/' + uid).set({ name: m.from, at: FB.ts(), s: JSON.stringify(m.s) })
      else FB.db.collection('trades').add({ from: m.from, uid, ts: FB.ts(), m: JSON.stringify({ ...m, ts: Date.now() }) }).catch(() => { status = 'Could not send. Check your connection.'; notify() })
    } catch { status = 'Could not send. Check your connection.'; notify() }
  }
  return { sub(f) { subs.add(f); start(); return () => subs.delete(f) }, log: () => log, pres: () => pres, status: () => status, state: () => state, send }
})()

// Everything about a trade is rebuilt from the message log, so a reload never loses a session.
function derive(log, me, pres) {
  const now = Date.now(), by = {}
  for (const m of log) if (typeof m.id === 'string') (by[m.id] ||= []).push(m)
  const names = Object.keys(pres).filter((n) => n !== me && now - pres[n].at < 130000)
  const invites = [], outgoing = []
  let act = null
  for (const [id, ms] of Object.entries(by)) {
    const inv = ms.find((m) => m.t === 'inv' && typeof m.to === 'string')
    if (!inv || now - inv.at > 20 * 60000 || (inv.from !== me && inv.to !== me) || inv.from === inv.to) continue
    if (ms.some((m) => m.t === 'cancel')) continue
    const a = inv.from, b = inv.to, partner = a === me ? b : a
    const dones = new Set(ms.filter((m) => m.t === 'done').map((m) => m.from))
    if (dones.has(a) && dones.has(b)) continue
    const acc = ms.find((m) => m.t === 'acc' && m.from === b)
    if (!acc) {
      if (now - inv.at < 5 * 60000) (b === me ? invites : outgoing).push({ id, from: a, to: b })
      continue
    }
    const offerOf = (w) => ((ms.filter((m) => m.t === 'off' && m.from === w).pop() || {}).offer || []).filter((x) => byId(x)).slice(0, 4)
    const oa = offerOf(a), ob = offerOf(b)
    const h = [...oa].sort().join(',') + '|' + [...ob].sort().join(',')
    const locked = (w) => (ms.filter((m) => m.t === 'lock' && m.from === w).pop() || {}).h === h
    const changedAt = Math.max(acc.seen, ...ms.filter((m) => m.t === 'off').map((m) => m.seen))
    const heard = new Set(), chat = []
    for (const m of ms) { const key = m.mid || m.nid; if (m.t === 'say' && m.text && (m.from === a || m.from === b) && !heard.has(key)) { heard.add(key); chat.push({ from: m.from, text: m.text, key }) } }
    act = { id, partner, chat, mine: a === me ? oa : ob, theirs: a === me ? ob : oa, h, changedAt, myLock: locked(me), theirLock: locked(partner), ready: locked(a) && locked(b) && oa.length > 0 && ob.length > 0, done: dones.has(me) }
  }
  return { names, invites, outgoing, act }
}

// Bazaar listings, rebuilt from the log. First valid buyer wins; a stalled sale reopens after 8 minutes.
function deriveBazaar(log) {
  const now = Date.now(), L = new Map()
  for (const m of log) {
    if (m.t === 'list') { if (byId(m.blook) && Number.isInteger(m.price) && m.price >= 1 && m.price <= 1000000 && typeof m.id === 'string' && !L.has(m.id)) L.set(m.id, { id: m.id, seller: m.from, blook: m.blook, price: m.price, at: m.at, state: 'open', buyer: null, buyAt: 0 }); continue }
    const l = L.get(m.id)
    if (!l) continue
    if (l.state === 'pending' && m.t === 'buy' && m.at - l.buyAt > 8 * 60000) { l.state = 'open'; l.buyer = null }
    if (m.t === 'unlist' && m.from === l.seller && l.state === 'open') l.state = 'gone'
    else if (m.t === 'buy' && m.from !== l.seller && l.state === 'open') { l.state = 'pending'; l.buyer = m.from; l.buyAt = m.at }
    else if (m.t === 'sold' && m.from === l.seller && l.state === 'pending' && m.to === l.buyer) l.state = 'sold'
  }
  for (const l of L.values()) {
    if (l.state === 'pending' && now - l.buyAt > 8 * 60000) { l.state = 'open'; l.buyer = null }
    if (l.state === 'open' && now - l.at > 11 * 3600000) l.state = 'expired'
  }
  return { list: [...L.values()], byId: Object.fromEntries(L) }
}

let lastSay = 0
function useTradeEngine(user, update) {
  const [, force] = useState(0), timer = useRef(), latest = useRef(user)
  latest.current = user
  useEffect(() => { const off = hub.sub(() => force((n) => n + 1)); const id = setInterval(() => force((n) => n + 1), 15000); return () => { off(); clearInterval(id) } }, [])
  useEffect(() => { const p = () => { const u = latest.current; hub.send({ t: 'pres', from: u.name, s: snapOf(u) }) }; p(); const id = setInterval(p, 90000); return () => clearInterval(id) }, [user.name])
  const view = derive(hub.log(), user.name, hub.pres()), act = view.act, bz = deriveBazaar(hub.log()), gd = deriveGuild(hub.log(), hub.pres(), user.name, user.guild)
  useEffect(() => { // runs once when both sides accepted identical offers
    const u = latest.current
    if (!act || !act.ready || act.done || (u.done || []).includes(act.id)) return
    const inv = [...u.inv]
    for (const id of act.mine) { const i = inv.indexOf(id); if (i < 0) { hub.send({ t: 'cancel', id: act.id, from: u.name }); return } inv.splice(i, 1) }
    update({ ...u, inv: [...inv, ...act.theirs], trades: (u.trades || 0) + 1, done: [...(u.done || []).slice(-49), act.id] })
    hub.send({ t: 'done', id: act.id, from: u.name })
  }, [act?.ready, act?.id, act?.done])
  const k1 = bz.list.filter((l) => l.seller === user.name && l.state === 'pending').map((l) => l.id + l.buyer).join()
  useEffect(() => { // seller side: confirm a sale, hand over the escrowed blook, collect the tokens
    const u = latest.current; let nu = u
    for (const l of bz.list) {
      if (l.seller !== u.name || l.state !== 'pending' || Date.now() - l.buyAt > 5 * 60000) continue
      const e = (nu.escrow || []).find((x) => x.id === l.id)
      if (!e) continue
      nu = { ...nu, escrow: nu.escrow.filter((x) => x.id !== l.id), tokens: nu.tokens + Math.floor(e.price * 0.95), sales: (nu.sales || 0) + 1 }
      hub.send({ t: 'sold', id: l.id, from: u.name, to: l.buyer })
    }
    if (nu !== u) update(nu)
  }, [k1])
  useEffect(() => { // listings that outlive the relay history come back to the seller
    const u = latest.current, old = (u.escrow || []).filter((e) => Date.now() - e.at > 11.5 * 3600000)
    if (!old.length) return
    update({ ...u, escrow: u.escrow.filter((e) => !old.includes(e)), inv: [...u.inv, ...old.map((e) => e.blook)] })
    old.forEach((e) => hub.send({ t: 'unlist', id: e.id, from: u.name }))
  }, [Math.floor(Date.now() / 600000)])
  const k2 = (user.buying || []).map((e) => { const l = bz.byId[e.id]; return e.id + (l ? l.state + l.buyer : '-') }).join() + Math.floor(Date.now() / 15000)
  useEffect(() => { // buyer side: receive the blook, or get the tokens back
    const u = latest.current
    if (!(u.buying || []).length) return
    const nu = { ...u, buying: [] }; let changed = false
    for (const e of u.buying) {
      const l = bz.byId[e.id]
      if (l && l.state === 'sold' && l.buyer === u.name) { nu.inv = [...nu.inv, e.blook]; changed = true }
      else if ((l && (l.state === 'gone' || l.state === 'expired' || (l.buyer && l.buyer !== u.name))) || Date.now() - e.at > 8 * 60000) { nu.tokens += e.price; changed = true }
      else nu.buying.push(e)
    }
    if (changed) update(nu)
  }, [k2])
  const sendm = (m) => hub.send({ ...m, from: latest.current.name })
  useEffect(() => { // remember boss progress on this device
    const u = latest.current, g = u.guild
    if (!g || !gd.boss.applied.length) return
    update({ ...u, guild: { ...g, boss: { k: gd.boss.k, hp: gd.boss.hp, mids: [...((g.boss && g.boss.mids) || []), ...gd.boss.applied].slice(-150) } } })
  }, [gd.boss.applied.join(), user.guild && user.guild.id])
  useEffect(() => { // keep the guild listed in the directory, with its logo
    const g = latest.current.guild
    if (!g) return
    const ann = () => sendm({ t: 'gann', gid: g.id, gname: g.name, tag: g.tag, logo: g.logo || undefined })
    ann(); const id = setInterval(ann, 600000); return () => clearInterval(id)
  }, [user.guild && user.guild.id])
  return {
    view, bz, gd, status: hub.status(), conn: hub.state(),
    invite: (to) => sendm({ t: 'inv', id: crypto.randomUUID().slice(0, 8), to }),
    accept: (id) => sendm({ t: 'acc', id }),
    cancel: (id) => sendm({ t: 'cancel', id }),
    lock: (id, h) => sendm({ t: 'lock', id, h }),
    say: (id, text) => { const t = text.trim(); if (!t || Date.now() - lastSay < 800) return false; lastSay = Date.now(); sendm({ t: 'say', id, text: t.slice(0, 120), mid: crypto.randomUUID().slice(0, 8) }); return true },
    setOffer: (id, offer) => { clearTimeout(timer.current); timer.current = setTimeout(() => sendm({ t: 'off', id, offer }), 350) },
    list: (blook, price) => {
      const u = latest.current, i = u.inv.indexOf(blook)
      if (i < 0 || !Number.isInteger(price) || price < 1 || price > 1000000) return false
      const id = crypto.randomUUID().slice(0, 8)
      update({ ...u, inv: u.inv.filter((_, k) => k !== i), escrow: [...(u.escrow || []), { id, blook, price, at: Date.now() }] })
      sendm({ t: 'list', id, blook, price }); return true
    },
    unlist: (id) => {
      const u = latest.current, e = (u.escrow || []).find((x) => x.id === id), l = bz.byId[id]
      if (!e || (l && l.state === 'pending')) return false
      update({ ...u, escrow: u.escrow.filter((x) => x.id !== id), inv: [...u.inv, e.blook] })
      sendm({ t: 'unlist', id }); return true
    },
    createGuild: (name, tag, logo) => {
      const u = latest.current
      if (u.guild) return 'You are already in a guild.'
      if (u.tokens < 500) return 'You need 500 tokens.'
      if (gd.dir.some((d) => d.name.toLowerCase() === name.toLowerCase() || d.tag === tag)) return 'That name or tag is already taken.'
      const id = crypto.randomUUID().replace(/-/g, '').slice(0, 10)
      update({ ...u, tokens: u.tokens - 500, guild: { id, name, tag, logo: logo || '', founder: u.name, boss: { k: 0, hp: null, mids: [] } } })
      sendm({ t: 'gcreate', gid: id, gname: name, tag, logo: logo || undefined }); return ''
    },
    joinGuild: (d) => {
      const u = latest.current
      if (u.guild) return
      update({ ...u, guild: { id: d.gid, name: d.name, tag: d.tag, logo: d.logo || '', founder: d.founder || '', boss: { k: 0, hp: null, mids: [] } } })
      sendm({ t: 'gjoin', gid: d.gid })
    },
    leaveGuild: () => { const u = latest.current; if (!u.guild) return; sendm({ t: 'gleave', gid: u.guild.id }); update({ ...u, guild: null }) },
    strike: (dmg, crit) => { const g = latest.current.guild; if (g) sendm({ t: 'gstrike', gid: g.id, dmg, crit, bk: gd.boss.k, hp: Math.max(-1, gd.boss.hp - dmg), mid: crypto.randomUUID().slice(0, 8) }) },
    gsay: (text) => { const g = latest.current.guild, t = text.trim(); if (!g || !t || Date.now() - lastSay < 800) return false; lastSay = Date.now(); sendm({ t: 'gsay', gid: g.id, text: t.slice(0, 120), mid: crypto.randomUUID().slice(0, 8) }); return true },
    buy: (l) => {
      const u = latest.current
      if (u.tokens < l.price || l.seller === u.name || l.state !== 'open') return false
      update({ ...u, tokens: u.tokens - l.price, buying: [...(u.buying || []), { id: l.id, price: l.price, blook: l.blook, at: Date.now() }] })
      sendm({ t: 'buy', id: l.id }); return true
    },
  }
}

const rnd = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296 }
const rankOf = (id) => Math.max(0, RK.indexOf((byId(id) || {}).rarity))
const FEE = 20, UP = [20, 20, 20, 15, 8, 3, 0]
const labPair = (a, b, cats) => {
  const hi = Math.max(rankOf(a), rankOf(b))
  return { hi, up: hi >= 6 ? 0 : Math.min(60, Math.round(UP[hi] * (rankOf(a) === rankOf(b) ? 1.5 : 1)) + 3 * cats) }
}

function Lab({ user, update }) {
  const EMPTY = [null, null, null, null, null]
  const [slots, setSlots] = useState(EMPTY), [busy, setBusy] = useState(null)
  useEffect(() => { setSlots(EMPTY) }, [user.inv.join('|')])
  const idAt = (k) => { const id = slots[k] != null ? user.inv[slots[k]] : null; return id && !isFuse(id) && byId(id) ? id : null } // plain blooks only
  const ids = [0, 1, 2, 3, 4].map(idAt), a = ids[0], b = ids[1], cats = ids.slice(2).filter(Boolean)
  const ready = !!(a && b), info = ready ? labPair(a, b, cats.length) : null
  const preview = ready ? `fuse:${a}+${b}:${info.hi}` : null, pv = preview ? byId(preview) : null
  const items = user.inv.map((id, i) => [id, i]).filter(([id]) => !isFuse(id))
  const pick = (i) => {
    const at = slots.indexOf(i)
    if (at >= 0) { setSlots(slots.map((s, k) => (k === at ? null : s))); return }
    const k = slots.indexOf(null)
    if (k >= 0) setSlots(slots.map((s, j) => (j === k ? i : s)))
  }
  const fuse = () => { // a fusion always works: you pay the fee, the blooks are used up, and you get a hybrid
    if (!ready || busy || !pv || user.tokens < FEE) return
    const used = slots.filter((s) => s != null), survive = user.inv.filter((_, i) => !used.includes(i))
    const log = user.labLog || [], stats = { ...(user.labStats || {}) }
    let r = info.hi, boosted = false
    if (r < 6 && rnd() * 100 < info.up) { r += 1; boosted = true }
    const id = `fuse:${a}+${b}:${r}`
    if (!byId(id)) return
    const key = [a, b].sort().join('+'), s = stats[key] || { n: 0, best: 0 }
    stats[key] = { n: s.n + 1, best: Math.max(s.best, r) }
    const isNew = !log.includes(id)
    update({ ...user, tokens: user.tokens - FEE, fused: (user.fused || 0) + 1, inv: [...survive, id], labLog: isNew ? [...log, id].slice(-200) : log, labStats: stats })
    setBusy({ a, b, id, isNew, boosted, k: Date.now() }); setSlots(EMPTY)
  }
  const slotBtn = (k, big) => (
    <button key={k} onClick={() => slots[k] != null && pick(slots[k])} aria-label={k < 2 ? (k === 0 ? 'Parent A' : 'Parent B') : `Catalyst ${k - 1}`} className={`grid place-items-center rounded-full border-4 border-dashed border-[#a8541a]/60 bg-white/30 transition hover:scale-105 ${big ? 'h-36 w-36' : 'h-20 w-20'}`}>
      {ids[k] ? <Blook id={ids[k]} size={big ? 100 : 56} /> : <span className="chunk text-3xl text-[#a8541a]/60">{k === 0 ? 'A' : k === 1 ? 'B' : '+'}</span>}
    </button>
  )
  const journal = user.labLog || []
  return (
    <div className="space-y-5 text-[#4a1f06]">
      <h2 className="chunk text-5xl">Blook Lab</h2>
      <p>Pick two parent blooks to fuse into a hybrid. Every fusion works. It costs {FEE} tokens and uses up all the blooks you put in. Add up to three catalyst blooks to raise the chance that the hybrid comes out one rarity higher.</p>
      <section className="rounded-[2rem] border-b-8 border-black/15 bg-white/40 p-5">
        <div className="flex flex-wrap items-center justify-center gap-3">
          {slotBtn(0, true)}<span className="chunk text-4xl">+</span>{slotBtn(1, true)}<span className="chunk text-4xl">=</span>
          <div className="grid h-40 w-40 place-items-center rounded-full bg-white/50">{pv ? <Blook id={preview} size={120} className="bob" /> : <span className="chunk text-5xl">?</span>}</div>
        </div>
        <div className="mt-4 flex items-center justify-center gap-3"><span className="chunk">Catalysts</span>{[2, 3, 4].map((k) => slotBtn(k, false))}</div>
        {ready && pv ? (
          <div className="mt-4 text-center">
            <div className="chunk text-2xl">{pv.name}</div>
            <div>Starts as <span className="chunk" style={{ color: RARITY[RK[info.hi]].color }}>{RARITY[RK[info.hi]].label}</span>{info.up > 0 ? `, ${info.up}% chance to rise to ${RARITY[RK[info.hi + 1]].label}` : ''}</div>
            <div className="mt-1 flex items-center justify-center gap-1">Fee: {FEE} <Coins size={26} /></div>
          </div>
        ) : <p className="mt-4 text-center">Tap two blooks below to start.</p>}
        <div className="mt-4 flex justify-center"><button className="btn bg-[#f7953a] text-2xl text-white disabled:opacity-50" disabled={!ready || !!busy || user.tokens < FEE} onClick={fuse}>{ready && user.tokens < FEE ? 'Not enough tokens' : 'Fuse!'}</button></div>
      </section>
      <section>
        <h3 className="chunk mb-2 text-2xl">Your blooks</h3>
        <div className="flex flex-wrap gap-2">
          {items.length === 0 && <p>You have no blooks to fuse yet. Open a pack in the Market!</p>}
          {items.map(([id, i]) => <button key={i} onClick={() => pick(i)} aria-label={byId(id).name} className={`grid h-24 w-24 place-items-center transition hover:-translate-y-1 ${slots.includes(i) ? 'rounded-3xl ring-4 ring-amber-400' : ''}`}><Blook id={id} size={80} /></button>)}
        </div>
      </section>
      <section className="rounded-[2rem] bg-white/35 p-4">
        <h3 className="chunk mb-2 text-2xl">Lab journal ({journal.length} combos discovered)</h3>
        <div className="flex flex-wrap gap-4">

        </div>
      </section>
      {busy && <LabReveal key={busy.k} info={busy} onClose={() => setBusy(null)} />}
    </div>
  )
}

// ---- RPG training: feed spare blooks to a main blook, level it to 15, spend stat points ----
const XPV = { common: 10, uncommon: 20, rare: 45, epic: 110, legendary: 280, mystical: 700, zero: 1800 }
const needXp = (L) => (25 * (L - 1) * L) / 2
const bLevel = (xp) => { let L = 1; while (L < 15 && xp >= needXp(L + 1)) L++; return L }
const STATS = [['pow', 'Power', 'Quiz damage and guild boss multiplier'], ['def', 'Defense', 'Outpost shield points'], ['spd', 'Speed', 'Quiz cooldown reduction'], ['luk', 'Luck', 'Bonus on token drops']]
const PERKS = [[5, 'Shielding Crust', 'Ignores 1 wrong-answer penalty in guild quizzes'], [10, 'Lucky Charm', '+10% bonus on token drops'], [15, 'Overdrive', '+25% quiz damage']]
const rpgOf = (u, id) => {
  const r = (u.rpg || {})[id] || {}, sp = { pow: 0, def: 0, spd: 0, luk: 0, ...(r.sp || {}) }, xp = r.xp || 0, lv = bLevel(xp)
  return { xp, lv, sp, pts: 2 * (lv - 1) - (sp.pow + sp.def + sp.spd + sp.luk) }
}
const luckMult = (u) => { if (!u.main || !u.inv.includes(u.main)) return 1; const r = rpgOf(u, u.main); return 1 + r.sp.luk * 0.02 + (r.lv >= 10 ? 0.1 : 0) }

function Training({ user, update }) {
  const [ask, setAsk] = useState(null), [msg, setMsg] = useState('')
  const counts = user.inv.reduce((m, id) => ((m[id] = (m[id] || 0) + 1), m), {})
  const owned = Object.keys(counts).filter((id) => byId(id)), spares = owned.filter((id) => counts[id] >= 2)
  const main = user.main && counts[user.main] ? user.main : null, r = main ? rpgOf(user, main) : null
  const spent = r ? r.sp.pow + r.sp.def + r.sp.spd + r.sp.luk : 0
  const saveRpg = (patch, extra) => update({ ...user, ...extra, rpg: { ...(user.rpg || {}), [main]: { xp: r.xp, sp: r.sp, ...patch } } })
  const feed = (id) => {
    if (!main || counts[id] < 2 || r.lv >= 15) return
    const gain = XPV[byId(id).rarity] || 10, xp = Math.min(needXp(15), r.xp + gain), i = user.inv.indexOf(id)
    update({ ...user, inv: user.inv.filter((_, k) => k !== i), rpg: { ...(user.rpg || {}), [main]: { xp, sp: r.sp } } })
    setMsg(bLevel(xp) > r.lv ? `+${gain} XP. Level up! Now level ${bLevel(xp)}.` : `+${gain} XP`); setAsk(null)
  }

// ---- Guilds: all state is rebuilt from relay messages; each member also keeps their guild and boss progress locally ----
const BOSSES = [['Mega Golem', 1000000, '#9aa0ab'], ['Frost Wyrm', 1500000, '#7cc0ff'], ['Void Titan', 2500000, '#a47dff']]
const bossAt = (k) => { const b = BOSSES[k % 3]; return { name: b[0], max: Math.round(b[1] * (1 + 0.25 * Math.floor(k / 3))), color: b[2] } }
const archetype = (id) => {
  const b = byId(id); if (!b) return {}
  const packs = b.parts ? b.parts.map((p) => (byId(p) || {}).pack) : [b.pack]
  return { space: packs.includes('space'), breakfast: packs.includes('breakfast'), spooky: packs.includes('spooky') }
}
// Damage = (Base Power + Equipped Blook Stat) x Blook Level Multiplier, from the equipped (main) blook
function combat(u) {
  const id = u.main && u.inv.includes(u.main) ? u.main : null
  if (!id) return null
  const r = rpgOf(u, id), ar = archetype(id)
  return {
    id, lv: r.lv, base: 400, stat: r.sp.pow * 10,
    mult: 1 + (r.lv - 1) * 0.08 + (r.lv >= 15 ? 0.25 : 0) + (ar.spooky ? 0.15 : 0),
    critChance: ar.space ? 0.2 : 0.05, critMult: ar.space ? 2.5 : 2,
    cooldown: Math.max(8, 20 - r.sp.spd * 0.5), penalty: Math.max(0, (ar.breakfast ? 5 : 10) - r.sp.def * 0.25), crust: r.lv >= 5, ar,
  }
}
const strikeDmg = (cb, crit) => Math.round((cb.base + cb.stat) * cb.mult * (crit ? cb.critMult : 1))

function deriveGuild(log, pres, me, mine) {
  const now = Date.now(), dir = {}, strikes = [], talk = [], seenS = new Set(), seenT = new Set()
  for (const m of log) {
    if ((m.t === 'gcreate' || m.t === 'gann') && m.gid && m.gname && m.tag) {
      const d = dir[m.gid] || (dir[m.gid] = { gid: m.gid, name: m.gname, tag: m.tag, logo: '', founder: '' })
      d.name = m.gname; d.tag = m.tag; if (m.logo) d.logo = m.logo; if (m.t === 'gcreate' && !d.founder) d.founder = m.from
    } else if (mine && m.gid === mine.id) {
      if (m.t === 'gstrike' && Number.isInteger(m.dmg) && Number.isInteger(m.bk) && Number.isInteger(m.hp) && m.mid && !seenS.has(m.mid)) { seenS.add(m.mid); strikes.push(m) }
      else if (m.t === 'gsay' && m.text && !seenT.has(m.mid || m.nid)) { seenT.add(m.mid || m.nid); talk.push({ from: m.from, text: m.text, key: m.mid || m.nid }) }
    }
  }
  const members = {}
  for (const n of Object.keys(pres)) { const s = pres[n].s; if (s && s.g && now - pres[n].at < 12 * 3600000) (members[s.g] ||= []).push(n) }
  const list = Object.values(dir).filter((d) => (members[d.gid] || []).length > 0).map((d) => ({ ...d, count: members[d.gid].length }))
  const roster = mine ? [...new Set([me, ...(members[mine.id] || [])])].map((n) => { const s = n === me ? null : pres[n].s; return { name: n, lv: s ? s.lv : 0, tk: n === me ? null : s.tk, av: s ? s.av : null, online: n === me || now - pres[n].at < 130000 } }) : []
  // shared boss HP: start from what this device saved, then apply strikes it has not counted yet
  const b0 = (mine && mine.boss) || {}, done = new Set(b0.mids || []), applied = [], lastAt = {}
  let k = b0.k || 0, hp = b0.hp == null ? bossAt(k).max : b0.hp
  for (const s of strikes) {
    if (done.has(s.mid)) continue
    applied.push(s.mid)
    if (s.bk < k) continue // late hit on a boss that is already gone
    if (s.bk > k) { k = s.bk; hp = bossAt(k).max }
    if (lastAt[s.from] != null && s.at - lastAt[s.from] < 3000) continue // anti-spam
    lastAt[s.from] = s.at
    hp = Math.min(hp - s.dmg, s.hp)
    if (hp <= 0) { k++; hp = bossAt(k).max }
  }
  const feed = strikes.slice(-14).reverse().map((s) => ({ key: s.mid, text: `${s.from} dealt ${s.dmg.toLocaleString()}${s.crit ? ' (CRIT!)' : ''}` }))
  return { dir: list, roster, talk, feed, boss: { k, hp, applied, ...bossAt(k) } }
}

function Arena({ user, update, eng, go }) {
  const b = eng.gd.boss, cb = combat(user), now = useNow(250)
  const [qi, setQi] = useState(() => Math.floor(Math.random() * QUIZ.length)), [cool, setCool] = useState(0), [fx, setFx] = useState([]), [anim, setAnim] = useState(false), [msg, setMsg] = useState('')
  const q = QUIZ[qi], order = useMemo(() => [0, 1, 2, 3].sort(() => Math.random() - 0.5), [qi])
  const left = Math.max(0, Math.ceil((cool - now) / 1000)), pct = Math.max(0, Math.min(100, (b.hp / b.max) * 100))
  const next = () => setQi((i) => (i + 1 + Math.floor(Math.random() * (QUIZ.length - 1))) % QUIZ.length)
  const answer = (oi) => {
    if (!cb || left > 0) return
    const t = Date.now()
    if (oi === q[2]) {
      const crit = rnd() < cb.critChance, dmg = strikeDmg(cb, crit), id = t + Math.random()
      eng.strike(dmg, crit)
      setFx((f) => [...f, { id, dmg, crit }]); setTimeout(() => setFx((f) => f.filter((x) => x.id !== id)), 1300)
      setAnim(true); setTimeout(() => setAnim(false), 600)
      const day = new Date().toDateString(), got = user.raidDay === day ? (user.raidTk || 0) : 0, loot = got < 30 ? Math.max(1, Math.round(luckMult(user))) : 0
      if (loot) update({ ...user, tokens: user.tokens + loot, raidDay: day, raidTk: got + loot })
      setMsg(`${crit ? 'Critical hit! ' : ''}You dealt ${dmg.toLocaleString()} damage${loot ? ` and found ${loot} token${loot > 1 ? 's' : ''}` : ''}.`)
      setCool(t + cb.cooldown * 1000)
    } else if (cb.crust && t - (user.crustAt || 0) > 3600000) {
      update({ ...user, crustAt: t }); setMsg('Wrong answer, but Shielding Crust blocked the penalty!'); setCool(t + cb.cooldown * 1000)
    } else { setMsg(`Wrong! The boss counters: +${cb.penalty}s cooldown.`); setCool(t + (cb.cooldown + cb.penalty) * 1000) }
    next()
  }
  return (
    <section className="rounded-[2rem] border-b-8 border-black/15 bg-white/40 p-5">
      <div className="flex flex-wrap items-baseline justify-between gap-2"><h3 className="chunk text-3xl">{b.name}</h3><span className="chunk text-sm">Boss #{b.k + 1} · {b.k} defeated</span></div>
      <div className="mt-2 h-7 overflow-hidden rounded-full bg-black/30" role="progressbar" aria-valuenow={Math.round(pct)} aria-valuemin={0} aria-valuemax={100}><div className="h-full bg-gradient-to-r from-red-600 to-orange-400 transition-all duration-700" style={{ width: pct + '%' }} /></div>
      <div className="chunk mt-1 text-center text-sm">{Math.max(0, b.hp).toLocaleString()} / {b.max.toLocaleString()} HP</div>
      <div className="relative mt-3 flex items-end justify-center gap-4">
        {cb && <div className={anim ? 'lunge' : ''}><Blook id={cb.id} size={90} /></div>}
        <div className="relative w-full max-w-[250px]"><BossArt color={b.color} hit={anim} name={b.name} />
          {fx.map((f) => <span key={f.id} className={`floatdmg chunk ${f.crit ? 'text-4xl text-orange-600' : 'text-3xl text-red-600'}`} style={{ marginLeft: -50 }}>-{f.dmg.toLocaleString()} HP!</span>)}</div>
      </div>
      {!cb ? (
        <div className="mt-4 rounded-3xl bg-white/50 p-4 text-center"><p>Your equipped blook decides your strength in guild battles. Pick a main blook first.</p><button className="btn mt-2 bg-[#f7953a] text-white" onClick={() => go('train')}>Go to Training</button></div>
      ) : (
        <div className="mt-4 rounded-3xl bg-white/50 p-4">
          <p className="text-sm">Each strike: ({cb.base} + {cb.stat}) × {cb.mult.toFixed(2)} = {strikeDmg(cb, false).toLocaleString()} damage. {cb.ar.space ? 'Space blook: 20% crits for 2.5x.' : 'Crit chance 5% for 2x.'}{cb.ar.breakfast ? ' Breakfast blook: half the wrong-answer penalty.' : ''}{cb.ar.spooky ? ' Spooky blook: +15% damage.' : ''}</p>
          <p className="chunk mt-2 text-xl">{q[0]}</p>
          <div className="mt-2 grid gap-2 sm:grid-cols-2">
            {order.map((oi) => <button key={oi} disabled={left > 0} onClick={() => answer(oi)} className="btn bg-[#f7953a] text-lg text-white disabled:opacity-50">{q[1][oi]}</button>)}
          </div>
          <p className="chunk mt-2 text-center" role="status">{left > 0 ? `Next strike in ${left}s` : 'Ready to strike!'}</p>
          {msg && <p className="text-center text-sm">{msg}</p>}
        </div>
      )}

            {shown.length === 0 && <p>No guilds found yet. Guilds show up here while their members have Oranget open.</p>}
            {shown.map((d) => (
              <div key={d.gid} className="flex items-center gap-3 rounded-3xl bg-white/50 p-3"><GuildLogo g={d} size={52} /><div className="min-w-0 flex-1"><div className="chunk truncate">{d.name} [{d.tag}]</div><div className="text-xs">{d.count} member{d.count === 1 ? '' : 's'} active</div></div>
                <button className="btn bg-[#f7953a] px-4 py-1 text-base text-white" onClick={() => eng.joinGuild(d)}>Join</button></div>
            ))}
          </div>
        </section>
      </div>
    )
  }
  const coins = gd.roster.reduce((s, m) => s + (m.name === user.name ? user.tokens : m.tk || 0), 0)
  return (
    <div className="space-y-5 text-[#4a1f06]">
      <section className="flex flex-wrap items-center gap-4 rounded-[2rem] border-b-8 border-black/15 bg-white/40 p-5">
        <GuildLogo g={g} size={84} />
        <div className="min-w-[200px] flex-1"><h2 className="chunk text-4xl">{g.name} <span className="text-2xl">[{g.tag}]</span></h2>
          <div className="text-sm">Founded by {g.founder || 'unknown'} · {gd.roster.length} member{gd.roster.length === 1 ? '' : 's'} · Bosses defeated: {gd.boss.k}</div>
          <div className="chunk mt-1 flex items-center gap-1 text-xl"><Coins size={30} />{coins.toLocaleString()} <span className="text-sm">Guild Coins</span></div></div>
        {sure ? <div className="flex gap-2"><button className="btn bg-red-600 text-white" onClick={() => { eng.leaveGuild(); setSure(false) }}>Yes, leave</button><button className="btn bg-white/70 text-[#5a2608]" onClick={() => setSure(false)}>Stay</button></div>
          : <button className="btn bg-white/70 text-[#5a2608]" onClick={() => setSure(true)}>Leave guild</button>}
      </section>
      <div className="grid gap-5 xl:grid-cols-[1fr_340px]">
        <Arena user={user} update={update} eng={eng} go={go} />
        <div className="space-y-5">
          <section className="rounded-[2rem] bg-white/35 p-4"><h3 className="chunk mb-2 text-xl">Roster</h3>
            {gd.roster.map((m) => <div key={m.name} className="flex items-center gap-2 py-1"><span className={`h-3 w-3 rounded-full ${m.online ? 'bg-green-500' : 'bg-gray-400'}`} /><span className="chunk flex-1 truncate">{m.name}{m.name === g.founder ? ' (founder)' : ''}</span><span className="text-xs">{m.lv ? `Lv ${m.lv}` : ''}</span></div>)}</section>
          <GuildChat eng={eng} />
        </div>
      </div>
      <p className="text-sm">Guild boss progress is shared through the relay and saved on each member's device. Guild chat is only shown to members inside the game.</p>
    </div>
  )
}

const LB_KEY = 'oranget_lb', MEDAL = ['#ffc94d', '#c9d3e2', '#d98a4e']
const LB_TABS = [['sc', 'Block score'], ['tk', 'Tokens'], ['lv', 'Level'], ['ub', 'Blooks'], ['pk', 'Packs opened']]
function Leaderboard({ user, eng, go }) {
  const [by, setBy] = useState('sc'), [who, setWho] = useState(null), now = useNow(15000)
  const all = { ...read(LB_KEY, {}) }
  for (const [n, v] of Object.entries(hub.pres())) if (v.s) all[n] = { s: v.s, at: v.at }
  all[user.name] = { s: snapOf(user), at: Date.now() }
  const rows = Object.entries(all).filter(([n, v]) => NAME_OK.test(n) && v && v.s).map(([n, v]) => ({ n, s: v.s, on: n === user.name || now - v.at < 130000 })).sort((a, b) => (b.s[by] || 0) - (a.s[by] || 0) || a.n.localeCompare(b.n))
  useEffect(() => { const keep = Object.fromEntries(Object.entries(all).filter(([n]) => n !== user.name).sort((a, b) => b[1].at - a[1].at).slice(0, 150)); try { localStorage.setItem(LB_KEY, JSON.stringify(keep)) } catch {} }, [rows.length])
  const me = rows.findIndex((r) => r.n === user.name) + 1, top = rows.slice(0, 3), val = (r) => Number(r.s[by] || 0).toLocaleString()
  const order = top.length === 3 ? [1, 0, 2] : top.map((_, i) => i)
  return (
    <div className="mx-auto max-w-3xl space-y-6 pb-8 sm:p-4">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div><h2 className="chunk text-4xl sm:text-5xl">Leaderboard</h2><p className="mute mt-1 text-sm">You are #{me} of {rows.length}. Every player who has opened Oranget, ranked live.</p></div>
        <div className="seg" role="tablist" aria-label="Rank by">{LB_TABS.map(([k, l]) => <button key={k} role="tab" aria-selected={by === k} onClick={() => setBy(k)}>{l}</button>)}</div>
      </div>
      <div className="pod">{order.map((i) => { const r = top[i]; return (
        <button key={r.n} className="pod-col" onClick={() => setWho(r.n)} aria-label={`${r.n}, rank ${i + 1}`}>
          <Blook id={r.s.av} size={i === 0 ? 104 : 80} />
          <span className={`chunk max-w-full truncate ${nmCls(r.n)}`}>{r.n}</span>
          <span className="mute text-sm">{val(r)}</span>
          <span className="plinth display mt-2" style={{ height: [104, 76, 56][i], background: `linear-gradient(180deg,${MEDAL[i]},color-mix(in srgb,${MEDAL[i]} 35%,#1a1229))` }}>{i + 1}</span>
        </button>) })}</div>
      <div>{rows.slice(3).map((r, i) => (
        <button key={r.n} className={`lb-row ${r.n === user.name ? 'me' : ''}`} onClick={() => setWho(r.n)}>
          <span className="lb-rank display">{i + 4}</span><Blook id={r.s.av} size={44} />
          <span className="min-w-0 flex-1 text-left"><span className={`chunk block truncate ${nmCls(r.n)}`}>{r.n}<span className={`odot ${r.on ? 'on' : ''}`} title={r.on ? 'Online' : 'Offline'} /></span>
            <span className="mute text-xs">Level {r.s.lv} · {r.s.ub}/{BLOOKS.length} blooks · {r.s.pk} packs</span></span>
          <span className="chunk text-xl">{val(r)}</span>
        </button>))}
        {rows.length < 2 && <p className="mute">No other players seen yet. Players appear here while they have Oranget open.</p>}</div>
      {who && <ProfileCard name={who} me={user.name} snap={(rows.find((r) => r.n === who) || {}).s || null} onClose={() => setWho(null)} onTrade={() => { eng.invite(who); setWho(null); go('trade') }} />}
    </div>
  )
}

function SettingsModal({ user, update, onLogout, onClose }) {
  const [tab, setTab] = useState('look')
  useEffect(() => { const f = (e) => e.key === 'Escape' && onClose(); addEventListener('keydown', f); return () => removeEventListener('keydown', f) }, [])
  const setTheme = (t) => { try { localStorage.setItem('oranget_theme', t) } catch {} update({ ...user, theme: t }) }
  const theme = user.theme || 'orange'
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-40 grid place-items-center bg-black/60 p-3" onClick={onClose}>
      <div className="st" onClick={(e) => e.stopPropagation()} role="dialog" aria-label="Settings">
        <div className="flex items-center justify-between"><h3 className="display text-2xl">Settings</h3><button className="text-sm underline" onClick={onClose}>Close</button></div>
        <div className="seg self-start" role="tablist">{[['look', 'Theme'], ['acct', 'Account']].map(([k, l]) => <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}>{l}</button>)}</div>
        <div className="st-body">
          {tab === 'look' && <div className="flex gap-3">
            <button className="swatch" aria-pressed={theme === 'orange'} onClick={() => setTheme('orange')}><div className="mb-2 h-16 rounded-xl" style={{ background: 'linear-gradient(140deg,#ffc98a,#fba24d 55%,#f27d2c)' }} />Orange</button>
            <button className="swatch" aria-pressed={theme === 'black'} onClick={() => setTheme('black')}><div className="mb-2 h-16 rounded-xl" style={{ background: 'radial-gradient(70% 90% at 10% 0,rgba(255,122,18,.5),#0e0919 70%)' }} />Black</button></div>}
          {tab === 'acct' && <div className="space-y-3">
            <p>Signed in as <b className={nmCls(user.name)}>{user.name}</b>.</p>
            <p className="mute text-sm">Your progress saves to the cloud automatically. Log in with the same username and password in any browser.</p>
            <button className="btn bg-red-600 text-white" onClick={onLogout}>Log out</button></div>}
        </div>
      </div>
    </div>, document.body)
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: false } }
  static getDerivedStateFromError() { return { err: true } }
  componentDidCatch(e) { console.error(e) }
  render() {
    return this.state.err
      ? <div className="rounded-[2rem] bg-white/50 p-6 text-center text-[#4a1f06]"><p className="chunk text-2xl">Oops, something went wrong on this page.</p><button className="btn mt-4 bg-[#f7953a] text-white" onClick={() => this.setState({ err: false })}>Try again</button></div>
      : this.props.children
  }
}

function Loader({ full }) {
  return (
    <div className={`grid place-items-center ${full ? 'min-h-screen app-bg' : 'min-h-[50vh]'}`} role="status" aria-label="Loading">
      <div className="text-center">
        <div className="coin-spin mx-auto w-fit"><Coins size={96} /></div>
        <div className="chunk mt-4 text-3xl text-white">Loading<span className="dot ml-2" /><span className="dot" style={{ animationDelay: '.2s' }} /><span className="dot" style={{ animationDelay: '.4s' }} /></div>
      </div>
    </div>
  )
}

// Each tab has its own address (/blooks, /market ...). Falls back to #/blooks where the host cannot do real paths.
const TABS = ['home', 'blooks', 'market', 'bazaar', 'leaders', 'chat', 'trade']
const ROUTE = (() => {
  const seg = location.pathname.split('/').filter(Boolean), last = seg[seg.length - 1]
  const root = '/' + (TABS.includes(last) ? seg.slice(0, -1) : seg).join('/')
  const base = root === '/' ? '' : root
  let hash = true
  const read = () => {
    const s = location.hash.replace(/^#\/?/, '') || (TABS.includes(last) ? last : '')
    return TABS.includes(s) ? s : 'home'
  }
  const write = (t, replace) => {
    try {
      if (replace) history.replaceState(null, '', (base || '/') + location.search + '#/' + t); else location.hash = '/' + t
    } catch { hash = true; try { location.hash = '/' + t } catch {} }
  }
  return { get: read, go: (t) => write(t, false), replace: (t) => write(t, true) }
})()

const NAV = [['home', 'Home', Home], ['blooks', 'Blooks', Boxes], ['market', 'Market', Store], ['bazaar', 'Bazaar', Tag], ['leaders', 'Ranks', Trophy], ['chat', 'Chat', MessageCircle], ['trade', 'Trade', ArrowLeftRight]]

function FitBox({ children }) { // shrinks a page to fit any screen, so nothing needs scrolling
  const o = useRef(), i = useRef(), [sc, setSc] = useState(1)
  useEffect(() => {
    const f = () => { const a = o.current, b = i.current; if (!a || !b) return; const s = Math.max(0.82, Math.min(1, a.clientHeight / (b.offsetHeight || 1))); if (Math.abs(s - sc) > 0.015) setSc(s) }
    const ro = new ResizeObserver(f); ro.observe(o.current); ro.observe(i.current); addEventListener('resize', f); f()
    return () => { ro.disconnect(); removeEventListener('resize', f) }
  })
  return <div ref={o} className="h-full w-full overflow-y-auto overflow-x-hidden"><div ref={i} style={{ width: 100 / sc + '%', transform: `scale(${sc})`, transformOrigin: '0 0' }}>{children}</div></div>
}
function Dashboard({ user, update, onLogout }) {
  const [tab, setTab] = useState(ROUTE.get()), [loading, setLoading] = useState(false), [settings, setSettings] = useState(false), [pings, setPings] = useState(0)
  const tabRef = useRef(tab); tabRef.current = tab
  const go = (t) => { if (t === tabRef.current) return; ROUTE.go(t); setTab(t); setLoading(true) }
  useEffect(() => {
    ROUTE.replace(ROUTE.get())
    const f = () => { const t = ROUTE.get(); if (t !== tabRef.current) { setTab(t); setLoading(true) } }
    addEventListener('popstate', f); addEventListener('hashchange', f)
    return () => { removeEventListener('popstate', f); removeEventListener('hashchange', f) }
  }, [])
  useEffect(() => { if (!loading) return; const id = setTimeout(() => setLoading(false), 450); return () => clearTimeout(id) }, [loading, tab])
  useEffect(() => { document.title = 'Oranget | ' + (NAV.find((n) => n[0] === tab) || NAV[0])[1] }, [tab])
  const uref = useRef(user); uref.current = user
  useEffect(() => {
    onMsgSent = () => {
      const u = uref.current, now = Date.now(), day = new Date().toDateString(), got = u.chatDay === day ? (u.chatTk || 0) : 0
      const pay = now - (u.chatAt || 0) >= 20000 && got < 500 // 5 tokens per message, 20 s apart, 500 a day
      update({ ...u, msgs: (u.msgs || 0) + 1, tokens: u.tokens + (pay ? 5 : 0), chatAt: pay ? now : u.chatAt, chatDay: day, chatTk: got + (pay ? 5 : 0) })
    }
    return () => { onMsgSent = null }
  }, [])
  useEffect(() => { // daily bonus + a few tokens for every half minute you spend here
    const d0 = new Date().toDateString(); if (uref.current.dayBonus !== d0) update({ ...uref.current, tokens: uref.current.tokens + 100, dayBonus: d0 })
    const id = setInterval(() => { if (document.visibilityState === 'visible') update({ ...uref.current, tokens: uref.current.tokens + 2 }) }, 30000); return () => clearInterval(id)
  }, [])
  useEffect(() => { if (!BACKEND) return; const f = async () => { try { const d = await api('/api/grants'); if (d.total) update({ ...uref.current, tokens: uref.current.tokens + d.total }) } catch {} }; f(); const id = setInterval(f, 15000); return () => clearInterval(id) }, [])
  const [, rbTick] = useState(0)
  useEffect(() => { const f = () => rbTick((n) => n + 1); cmdSubs.add(f); return () => cmdSubs.delete(f) }, [])
  useEffect(() => chat.subscribe((l) => procCmds(l, uref.current, (f) => update(f(uref.current))), () => {}), [])
  useEffect(() => { if (localStorage.getItem('oranget_chatseen') == null) localStorage.setItem('oranget_chatseen', String(Date.now())) ; return chat.subscribe((l) => { if (tabRef.current === 'chat') { localStorage.setItem('oranget_chatseen', String(Date.now())); setPings(0) } else { const seen = Number(localStorage.getItem('oranget_chatseen')) || 0; setPings(l.filter((m) => m.ts > seen && m.user !== uref.current.name && pinged(m, uref.current.name)).length) } }, () => {}) }, [])
  useEffect(() => { if (tab === 'chat') { localStorage.setItem('oranget_chatseen', String(Date.now())); setPings(0) } }, [tab])
  const eng = useTradeEngine(user, update)
  const pending = eng.view.invites.length
  if (CS.banned[lc(user.name)]) return <div className="grid h-[100dvh] place-items-center bg-[#5a2608] p-6 text-center text-white"><div><h1 className="chunk text-5xl">Banned</h1><p className="mt-3">This account was banned from Oranget.</p><button className="btn mt-5 bg-white/20" onClick={onLogout}>Log out</button></div></div>
  return (
    <div className="app-bg relative flex h-[100dvh] flex-col overflow-hidden">
      <header className="topbar sticky top-0 z-20 flex flex-wrap items-center gap-x-4 gap-y-1 px-3 py-2 sm:px-6">
        <div className="logo">Oranget</div>
        <nav className="order-3 flex w-full gap-1 overflow-x-auto sm:order-none sm:w-auto sm:flex-1">
          {NAV.map(([k, label, Icon]) => (
            <button key={k} onClick={() => go(k)} aria-current={tab === k} className="tab flex shrink-0 items-center gap-2 text-base">
              <Icon size={19} /><span className={tab === k ? '' : 'hidden md:inline'}>{label}</span>
              {k === 'trade' && pending > 0 && <span className="rounded-full bg-red-600 px-2 text-xs text-white">{pending}</span>}
              {k === 'chat' && pings > 0 && <span className="rounded-full bg-red-600 px-2 text-xs text-white" aria-label={`${pings} mentions`}>@{pings}</span>}
            </button>
          ))}
        </nav>
        <div className="ml-auto flex items-center gap-2">
          <span className="chip"><Coins size={24} />{user.tokens.toLocaleString()}</span>
          <span className={`chunk hidden sm:block ${nmCls(user.name, 'text-[#fbe9d0]')}`}>{user.name}</span>
          <button onClick={() => setSettings(true)} aria-label="Settings" className="iconbtn rounded-xl p-2"><Gear size={22} /></button>
        </div>
      </header>
      <main className={`relative z-10 min-h-0 min-w-0 flex-1 ${tab === 'blooks' || tab === 'leaders' ? 'overflow-y-auto p-5 sm:p-8' : tab === 'chat' || tab === 'market' ? 'overflow-hidden p-0' : 'overflow-hidden p-3 sm:p-5'}`}>
        {loading ? <Loader /> : (
          <Boundary key={tab}><div className="page-in h-full">
            {tab === 'home' && <FitBox><Profile user={user} update={update} go={go} /></FitBox>}
            {tab === 'blooks' && <Blooks user={user} update={update} eng={eng} />}
            {tab === 'market' && <Market user={user} update={update} />}
            {tab === 'bazaar' && <Bazaar user={user} eng={eng} />}
            {tab === 'leaders' && <Leaderboard user={user} eng={eng} go={go} />}
            {tab === 'chat' && <Chat user={user} eng={eng} go={go} />}
            {tab === 'trade' && <FitBox><Trade user={user} eng={eng} /></FitBox>}
          </div></Boundary>
        )}
      </main>
      {settings && <SettingsModal user={user} update={update} onLogout={onLogout} onClose={() => setSettings(false)} />}
    </div>
  )
}

function App() {
  const [user, setUser] = useState(null), [ready, setReady] = useState(false)
  useEffect(() => { Promise.race([restoreSession(), new Promise((r) => setTimeout(() => r(null), 12000))]).catch(() => null).then((u) => { setUser(u); setReady(true) }) }, []) // valid signed token skips the landing page
  const update = (u) => { saveUser(u); setUser(u) }
  useEffect(() => { document.documentElement.dataset.theme = (user && user.theme) || read('oranget_theme', 'orange') }, [user && user.theme])
  useEffect(() => {
    if (!document.querySelector('script[src*="tailwindcss"]') && !document.querySelector('style[data-tw]')) {
      const s = document.createElement('script'); s.src = 'https://cdn.tailwindcss.com'; document.head.appendChild(s)
    }
  }, [])
  return (
    <>
      <style>{CSS}</style>
      {!ready ? <Loader full /> : !user ? <Landing onAuth={setUser} /> : <Dashboard user={user} update={update} onLogout={async () => { await logOut(); location.reload() }} />}
    </>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
})()
</script>
